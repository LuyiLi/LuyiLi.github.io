<dialog class="hy-cite-dialog" id="hy-cite-dialog" aria-labelledby="hy-cite-heading" aria-describedby="hy-cite-title">
  <div class="hy-cite-header">
    <div><p class="hy-cite-eyebrow">Citation</p><h2 id="hy-cite-heading"></h2></div>
    <button class="hy-cite-close" type="button" aria-label="Close citation" autofocus>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <p class="hy-cite-title" id="hy-cite-title"></p>
  <div class="hy-cite-code-label">BibTeX</div>
  <pre class="hy-cite-code" tabindex="0" aria-label="BibTeX citation"><code id="hy-cite-code"></code></pre>
  <div class="hy-cite-footer">
    <a class="hy-cite-source" target="_blank" rel="noopener noreferrer"></a>
    <button class="hy-cite-copy" type="button">Copy BibTeX</button>
  </div>
  <p class="hy-cite-status" role="status" aria-live="polite"></p>
</dialog>
